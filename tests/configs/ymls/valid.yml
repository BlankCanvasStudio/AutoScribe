apikey: "some-string-of-text"

directives:
  readme: 
    prompt: /etc/autoscribe/prompts/readme.txt
    kind: text
    output: README.md
    model: GPT 4.1 Nano
  helpmenu:
    prompt: /etc/autoscribe/prompts/helpmenu/generate-text.txt
    kind: text
  helpimplementation:
    prompt: /etc/autoscribe/prompts/helpmenu/print-implementation.txt
  helpupdate:
    prompt: /etc/autoscribe/prompts/helpmenu/update-implementation.txt
    kind: text
  docs:
    prompt: /etc/autoscribe/prompts/docs.txt
    kind: docs
  pt:
    prompt_text: "some prompt text"
    kind: text

